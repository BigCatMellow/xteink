name: Build Island Links
on:
  push:
    branches: [main]
    paths:
      - 'island-links/**'
      - '.github/workflows/island-links.yml'
      - 'shared/game_ui.lua'
      - 'shared/game_theme.lua'
      - 'shared/game_style.lua'
      - 'shared/typefaces.lua'
      - 'shared/font_data.lua'
      - 'shared/font_license.lua'
      - 'assets/fonts/game-ui/**'
      - 'scripts/sync_game_theme.py'
      - 'scripts/make_game_fonts.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua and crypto
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
          python -m pip install cryptography pillow
      - name: Validate twelve unique bridge puzzles
        run: python island-links/tests/validate_levels.py
      - name: Test island and bridge logic and static rendering
        run: cd island-links && lua tests/test_game.lua
      - name: Verify shared copies and bitmap gameplay layouts
        run: |
          python scripts/sync_game_ui.py --check
          python scripts/sync_game_theme.py --check
          cd island-links && lua ../tests/run_themed_game.lua
      - name: Fetch pinned community packer
        run: |
          git clone --quiet https://github.com/omer-faruq-xteink/touch-licorice-apps.git /tmp/xtapp-tools
          git -C /tmp/xtapp-tools checkout --quiet 3d7e6225efc9b18d2b4aeed324a32b2e352d1f0d
      - name: Check Lua 5.5 compatibility
        run: |
          for source in island-links/app/*.lua; do
            python /tmp/xtapp-tools/tools/lualint55.py "$source"
          done
      - name: Package installable XTApp
        run: |
          mkdir -p dist
          python /tmp/xtapp-tools/xtpack.py island-links/app -o dist/island-links.xtapp
          python -c "from pathlib import Path; p=Path('dist/island-links.xtapp'); assert p.read_bytes()[:4]==b'XTAP' and p.stat().st_size>256"
      - uses: actions/upload-artifact@v4
        with:
          name: island-links-xtapp
          path: dist/island-links.xtapp
          if-no-files-found: error
