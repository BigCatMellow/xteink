name: Build Lantern Logic
on:
  push:
    branches: [main]
    paths:
      - 'lantern-logic/**'
      - '.github/workflows/lantern-logic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua and crypto
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
          python -m pip install cryptography
      - name: Validate unique puzzle solutions
        run: python lantern-logic/tests/validate_levels.py
      - name: Test gameplay and static rendering
        run: cd lantern-logic && lua tests/test_game.lua
      - name: Get pinned community packer
        run: |
          git clone --quiet https://github.com/omer-faruq-xteink/touch-licorice-apps.git /tmp/xtapp-tools
          git -C /tmp/xtapp-tools checkout --quiet 3d7e6225efc9b18d2b4aeed324a32b2e352d1f0d
      - name: Check Lua 5.5 compatibility
        run: python /tmp/xtapp-tools/tools/lualint55.py lantern-logic/app/index.lua
      - name: Build installable XTApp
        run: |
          mkdir -p dist
          python /tmp/xtapp-tools/xtpack.py lantern-logic/app -o dist/lantern-logic.xtapp
          python -c "from pathlib import Path; p=Path('dist/lantern-logic.xtapp'); assert p.read_bytes()[:4]==b'XTAP' and p.stat().st_size>256"
      - uses: actions/upload-artifact@v4
        with:
          name: lantern-logic-xtapp
          path: dist/lantern-logic.xtapp
          if-no-files-found: error
