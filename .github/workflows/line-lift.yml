name: Build Line Lift
on:
  push:
    branches: [main]
    paths:
      - 'line-lift/**'
      - '.github/workflows/line-lift.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua and crypto
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
          python -m pip install cryptography pillow
      - name: Test game logic and monochrome rendering
        run: cd line-lift && lua tests/test_game.lua
      - name: Fetch pinned Licorice packer
        run: |
          git clone --quiet https://github.com/omer-faruq-xteink/touch-licorice-apps.git /tmp/xtapp-tools
          git -C /tmp/xtapp-tools checkout --quiet 3d7e6225efc9b18d2b4aeed324a32b2e352d1f0d
      - name: Check Lua 5.5 compatibility
        run: python /tmp/xtapp-tools/tools/lualint55.py line-lift/app/index.lua
      - name: Package the XTApp
        run: |
          mkdir -p dist
          python /tmp/xtapp-tools/xtpack.py line-lift/app -o dist/line-lift.xtapp
          python -c "from pathlib import Path; p=Path('dist/line-lift.xtapp'); assert p.read_bytes()[:4]==b'XTAP' and p.stat().st_size>256"
      - uses: actions/upload-artifact@v4
        with:
          name: line-lift-xtapp
          path: dist/line-lift.xtapp
          if-no-files-found: error
