name: Build Link Grid
on:
  push:
    branches: [main]
    paths:
      - 'link-grid/**'
      - '.github/workflows/link-grid.yml'
      - 'shared/game_ui.lua'
      - 'shared/game_theme.lua'
      - 'shared/game_style.lua'
      - 'shared/typefaces.lua'
      - 'shared/font_data.lua'
      - 'shared/font_license.lua'
      - 'assets/fonts/game-ui/**'
      - 'scripts/sync_game_theme.py'
      - 'scripts/make_game_fonts.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua runtime and packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
          python -m pip install cryptography pillow
      - name: Independently verify 20 unique puzzle solutions
        run: python link-grid/tests/validate_levels.py
      - name: Test all level rules and static rendering
        run: cd link-grid && lua tests/test_game.lua
      - name: Verify shared copies and bitmap gameplay layouts
        run: |
          python scripts/sync_game_ui.py --check
          python scripts/sync_game_theme.py --check
          cd link-grid && lua ../tests/run_themed_game.lua
      - name: Get pinned community Licorice packer
        run: |
          git clone --quiet https://github.com/omer-faruq-xteink/touch-licorice-apps.git /tmp/xtapp-tools
          git -C /tmp/xtapp-tools checkout --quiet 3d7e6225efc9b18d2b4aeed324a32b2e352d1f0d
      - name: Validate Lua 5.5 syntax and APIs
        run: |
          for source in link-grid/app/*.lua; do
            python /tmp/xtapp-tools/tools/lualint55.py "$source"
          done
      - name: Build installable XTApp
        run: |
          mkdir -p dist
          python /tmp/xtapp-tools/xtpack.py link-grid/app -o dist/link-grid.xtapp
          python -c "from pathlib import Path; p=Path('dist/link-grid.xtapp'); assert p.read_bytes()[:4]==b'XTAP' and p.stat().st_size>256"
      - uses: actions/upload-artifact@v4
        with:
          name: link-grid-xtapp
          path: dist/link-grid.xtapp
          if-no-files-found: error
