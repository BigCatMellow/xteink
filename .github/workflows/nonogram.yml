name: Build Nonogram
on:
  push:
    branches: [main]
    paths:
      - 'nonogram/**'
      - '.github/workflows/nonogram.yml'
      - 'shared/game_ui.lua'
      - 'assets/icons/nonogram.svg'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua and native-icon dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
          python -m pip install cryptography Pillow
      - name: Verify all distinct monochrome launcher icons
        run: python scripts/make_icons.py --check
      - name: Verify original puzzle solutions
        run: python nonogram/tests/validate_levels.py
      - name: Test gameplay, saving and measured layout
        run: cd nonogram && lua tests/test_game.lua
      - name: Get pinned community Licorice packer
        run: |
          git clone --quiet https://github.com/omer-faruq-xteink/touch-licorice-apps.git /tmp/xtapp-tools
          git -C /tmp/xtapp-tools checkout --quiet 3d7e6225efc9b18d2b4aeed324a32b2e352d1f0d
      - name: Check Lua 5.5 source compatibility
        run: |
          python /tmp/xtapp-tools/tools/lualint55.py nonogram/app/index.lua
          python /tmp/xtapp-tools/tools/lualint55.py nonogram/app/pictures.lua
          python /tmp/xtapp-tools/tools/lualint55.py nonogram/app/ui.lua
      - name: Package installable XTApp
        run: |
          mkdir -p dist
          python /tmp/xtapp-tools/xtpack.py nonogram/app -o dist/nonogram.xtapp
          python -c "from pathlib import Path; p=Path('dist/nonogram.xtapp'); assert p.read_bytes()[:4]==b'XTAP' and p.stat().st_size>256"
      - name: Verify embedded 1-bit XTAB/XIC icon data
        run: python scripts/verify_package_icons.py dist/nonogram.xtapp
      - uses: actions/upload-artifact@v4
        with:
          name: nonogram-xtapp
          path: dist/nonogram.xtapp
          if-no-files-found: error
