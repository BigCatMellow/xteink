name: Build Quiet Mines
on:
  push:
    branches: [main]
    paths:
      - 'quiet-mines/**'
      - '.github/workflows/quiet-mines.yml'
      - 'shared/game_ui.lua'
      - 'assets/icons/quiet-mines.svg'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test runtime and icon dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
          python -m pip install cryptography Pillow
      - name: Verify original monochrome launcher icons
        run: python scripts/make_icons.py --check
      - name: Independent level validation
        run: python quiet-mines/tests/validate_levels.py
      - name: Gameplay, persistence and font-layout tests
        run: cd quiet-mines && lua tests/test_game.lua
      - name: Download pinned Licorice packer
        run: |
          git clone --quiet https://github.com/omer-faruq-xteink/touch-licorice-apps.git /tmp/xtapp-tools
          git -C /tmp/xtapp-tools checkout --quiet 3d7e6225efc9b18d2b4aeed324a32b2e352d1f0d
      - name: Check Lua 5.5 compatibility
        run: |
          python /tmp/xtapp-tools/tools/lualint55.py quiet-mines/app/index.lua
          python /tmp/xtapp-tools/tools/lualint55.py quiet-mines/app/levels.lua
          python /tmp/xtapp-tools/tools/lualint55.py quiet-mines/app/ui.lua
      - name: Build installable XTApp
        run: |
          mkdir -p dist
          python /tmp/xtapp-tools/xtpack.py quiet-mines/app -o dist/quiet-mines.xtapp
          python -c "from pathlib import Path; p=Path('dist/quiet-mines.xtapp'); assert p.read_bytes()[:4]==b'XTAP' and p.stat().st_size>256"
      - name: Verify embedded native 1-bit icon
        run: python scripts/verify_package_icons.py dist/quiet-mines.xtapp
      - uses: actions/upload-artifact@v4
        with:
          name: quiet-mines-xtapp
          path: dist/quiet-mines.xtapp
          if-no-files-found: error
