name: Build Ray Vault
on:
  push:
    branches: [main]
    paths:
      - 'ray-vault/**'
      - '.github/workflows/ray-vault.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua and crypto
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
          python -m pip install cryptography pillow
      - name: Independently verify atom arrangements
        run: python ray-vault/tests/validate_levels.py
      - name: Test ray rules and static UI
        run: cd ray-vault && lua tests/test_game.lua
      - name: Fetch pinned Licorice packer
        run: |
          git clone --quiet https://github.com/omer-faruq-xteink/touch-licorice-apps.git /tmp/xtapp-tools
          git -C /tmp/xtapp-tools checkout --quiet 3d7e6225efc9b18d2b4aeed324a32b2e352d1f0d
      - name: Check Lua 5.5 compatibility
        run: python /tmp/xtapp-tools/tools/lualint55.py ray-vault/app/index.lua
      - name: Package installable XTApp
        run: |
          mkdir -p dist
          python /tmp/xtapp-tools/xtpack.py ray-vault/app -o dist/ray-vault.xtapp
          python -c "from pathlib import Path; p=Path('dist/ray-vault.xtapp'); assert p.read_bytes()[:4]==b'XTAP' and p.stat().st_size>256"
      - uses: actions/upload-artifact@v4
        with:
          name: ray-vault-xtapp
          path: dist/ray-vault.xtapp
          if-no-files-found: error
