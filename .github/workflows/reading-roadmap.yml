name: Build Reading Roadmap
on:
  push:
    branches: [feat/reading-roadmap-xtapp]
    paths:
      - 'apps/reading-roadmap/**'
      - '.github/workflows/reading-roadmap.yml'
  pull_request:
    paths:
      - 'apps/reading-roadmap/**'
      - '.github/workflows/reading-roadmap.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
          python -m pip install cryptography Pillow==10.2.0
      - name: Retrieve pinned packer
        run: |
          git clone -q https://github.com/omer-faruq-xteink/touch-licorice-apps.git /tmp/xtapp-tools
          git -C /tmp/xtapp-tools checkout -q 3d7e6225efc9b18d2b4aeed324a32b2e352d1f0d
      - name: Validate Lua and runtime behavior
        run: |
          lua5.4 apps/reading-roadmap/tests/test_app.lua
          python apps/reading-roadmap/tests/test_preview_parity.py
          python /tmp/xtapp-tools/tools/lualint55.py apps/reading-roadmap/app/index.lua
      - name: Build native app
        run: |
          python apps/reading-roadmap/make_icon.py
          mkdir -p dist
          python /tmp/xtapp-tools/xtpack.py apps/reading-roadmap/app -o dist/reading-roadmap.xtapp
          python -c "from pathlib import Path; x=Path('dist/reading-roadmap.xtapp').read_bytes(); assert x[:4]==b'XTAP' and len(x)>512"
      - uses: actions/upload-artifact@v4
        with:
          name: reading-roadmap-xtapp
          path: |
            dist/reading-roadmap.xtapp
            apps/reading-roadmap/preview.html
          if-no-files-found: error
