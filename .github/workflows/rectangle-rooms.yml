name: Build Rectangle Rooms
on:
  push:
    branches: [main]
    paths:
      - 'games/rectangle-rooms/**'
      - '.github/workflows/rectangle-rooms.yml'
      - 'shared/game_ui.lua'
      - 'assets/icons/rectangle-rooms.svg'
      - 'shared/game_theme.lua'
      - 'shared/game_style.lua'
      - 'shared/typefaces.lua'
      - 'shared/font_data.lua'
      - 'shared/font_license.lua'
      - 'assets/fonts/game-ui/**'
      - 'scripts/sync_game_theme.py'
      - 'scripts/make_game_fonts.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua and packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
          python -m pip install cryptography Pillow
      - name: Verify distinct 96px monochrome icons
        run: python scripts/make_icons.py --check
      - name: Independently validate puzzle solutions
        run: python games/rectangle-rooms/tests/validate_levels.py
      - name: Test gameplay and measured e-ink layouts
        run: cd games/rectangle-rooms && lua tests/test_game.lua
      - name: Verify shared copies and bitmap gameplay layouts
        run: |
          python scripts/sync_game_ui.py --check
          python scripts/sync_game_theme.py --check
          cd games/rectangle-rooms && lua ../../tests/run_themed_game.lua
      - name: Get pinned Licorice packer
        run: |
          git clone --quiet https://github.com/omer-faruq-xteink/touch-licorice-apps.git /tmp/xtapp-tools
          git -C /tmp/xtapp-tools checkout --quiet 3d7e6225efc9b18d2b4aeed324a32b2e352d1f0d
      - name: Check Lua 5.5 compatibility
        run: |
          for source in games/rectangle-rooms/app/*.lua; do
            python /tmp/xtapp-tools/tools/lualint55.py "$source"
          done
      - name: Build installable XTApp
        run: |
          mkdir -p dist
          python /tmp/xtapp-tools/xtpack.py games/rectangle-rooms/app -o dist/rectangle-rooms.xtapp
          python -c "from pathlib import Path; p=Path('dist/rectangle-rooms.xtapp'); assert p.read_bytes()[:4]==b'XTAP' and p.stat().st_size>256"
      - name: Verify embedded XTAB/XIC native icon
        run: python scripts/verify_package_icons.py dist/rectangle-rooms.xtapp
      - uses: actions/upload-artifact@v4
        with:
          name: rectangle-rooms-xtapp
          path: dist/rectangle-rooms.xtapp
          if-no-files-found: error
