name: Shell probe host checks
on:
  push:
    branches: [main]
    paths:
      - 'shell/**'
      - 'shared/game_ui.lua'
      - '.github/workflows/shell-probe.yml'
  pull_request:
    paths:
      - 'shell/**'
      - 'shared/game_ui.lua'
      - '.github/workflows/shell-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install host dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
          python -m pip install cryptography Pillow==10.2.0
      - name: Get pinned community tools
        run: |
          git clone --quiet https://github.com/omer-faruq-xteink/touch-licorice-apps.git /tmp/xtapp-tools
          git -C /tmp/xtapp-tools checkout --quiet 3d7e6225efc9b18d2b4aeed324a32b2e352d1f0d
      - name: Build isolated host probe and validate its package
        run: python shell/tools/build_probe.py --packer /tmp/xtapp-tools/xtpack.py --linter /tmp/xtapp-tools/tools/lualint55.py
      - name: Check callbacks, save failures and measured layouts
        run: lua shell/tests/test_probe.lua
      - name: Check capture integrity and rejection cases
        run: python shell/tests/test_capture.py
      - uses: actions/upload-artifact@v4
        with:
          name: shell-probe-host-only
          path: |
            dist/shell-probe/shell-probe.xtapp
            dist/shell-probe/receipt.json
          if-no-files-found: error
