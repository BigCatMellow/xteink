name: Sudoku screen-space pilot
on:
  push:
    branches: [main]
    paths:
      - 'games/sudoku/**'
      - 'tests/screen_space.lua'
      - 'scripts/render_sudoku_pilot.py'
      - '.github/workflows/sudoku-screen-space.yml'
  pull_request:
    paths:
      - 'games/sudoku/**'
      - 'tests/screen_space.lua'
      - 'scripts/render_sudoku_pilot.py'
      - '.github/workflows/sudoku-screen-space.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshot-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install screenshot runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
          python -m pip install Pillow==10.2.0
      - name: Render actual Sudoku bitmap-font states before and after
        run: python scripts/render_sudoku_pilot.py
      - uses: actions/upload-artifact@v4
        with:
          name: sudoku-screen-space-before-after
          path: dist/sudoku-screen-space/
          if-no-files-found: error
