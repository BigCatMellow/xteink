name: Build Sum Cross
on:
  push:
    branches: [main]
    paths:
      - 'games/sum-cross/**'
      - '.github/workflows/sum-cross.yml'
      - 'shared/game_ui.lua'
      - 'shared/game_theme.lua'
      - 'shared/game_style.lua'
      - 'shared/typefaces.lua'
      - 'shared/font_data.lua'
      - 'shared/font_license.lua'
      - 'assets/fonts/game-ui/**'
      - 'assets/icons/sum-cross.svg'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test runtime and icon dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
          python -m pip install cryptography Pillow
      - name: Verify original monochrome launcher icons
        run: python scripts/make_icons.py --check
      - name: Independent level validation
        run: python games/sum-cross/tests/validate_levels.py
      - name: Gameplay, persistence and font-layout tests
        run: cd games/sum-cross && lua tests/test_game.lua
      - name: Verify shared theme and bitmap gameplay
        run: |
          python scripts/sync_game_ui.py --check
          python scripts/sync_game_theme.py --check
          cd games/sum-cross && lua ../../tests/run_themed_game.lua
      - name: Download pinned Licorice packer
        run: |
          git clone --quiet https://github.com/omer-faruq-xteink/touch-licorice-apps.git /tmp/xtapp-tools
          git -C /tmp/xtapp-tools checkout --quiet 3d7e6225efc9b18d2b4aeed324a32b2e352d1f0d
      - name: Check Lua 5.5 compatibility
        run: |
          for source in games/sum-cross/app/*.lua; do
            python /tmp/xtapp-tools/tools/lualint55.py "$source"
          done
      - name: Build installable XTApp
        run: |
          mkdir -p dist
          python /tmp/xtapp-tools/xtpack.py games/sum-cross/app -o dist/sum-cross.xtapp
          python -c "from pathlib import Path; p=Path('dist/sum-cross.xtapp'); assert p.read_bytes()[:4]==b'XTAP' and p.stat().st_size>256"
      - name: Verify embedded native 1-bit icon
        run: python scripts/verify_package_icons.py dist/sum-cross.xtapp
      - uses: actions/upload-artifact@v4
        with:
          name: sum-cross-xtapp
          path: dist/sum-cross.xtapp
          if-no-files-found: error
