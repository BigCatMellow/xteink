name: Build Summit Putt
on:
  push:
    branches: [main]
    paths:
      - 'games/summit-putt/**'
      - '.github/workflows/summit-putt.yml'
      - 'shared/game_ui.lua'
      - 'shared/game_theme.lua'
      - 'shared/game_style.lua'
      - 'shared/typefaces.lua'
      - 'shared/font_data.lua'
      - 'shared/font_license.lua'
      - 'assets/fonts/game-ui/**'
      - 'scripts/sync_game_theme.py'
      - 'scripts/make_game_fonts.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua and crypto
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
          python -m pip install cryptography pillow
      - name: Exercise puzzle rules and renderer
        run: cd games/summit-putt && lua tests/test_game.lua
      - name: Verify shared copies and bitmap gameplay layouts
        run: |
          python scripts/sync_game_ui.py --check
          python scripts/sync_game_theme.py --check
          cd games/summit-putt && lua ../../tests/run_themed_game.lua
      - name: Fetch pinned community packer
        run: |
          git clone --quiet https://github.com/omer-faruq-xteink/touch-licorice-apps.git /tmp/xtapp-tools
          git -C /tmp/xtapp-tools checkout --quiet 3d7e6225efc9b18d2b4aeed324a32b2e352d1f0d
      - name: Lua compatibility check
        run: |
          for source in games/summit-putt/app/*.lua; do
            python /tmp/xtapp-tools/tools/lualint55.py "$source"
          done
      - name: Package installable XTApp
        run: |
          mkdir -p dist
          python /tmp/xtapp-tools/xtpack.py games/summit-putt/app -o dist/summit-putt.xtapp
          python -c "from pathlib import Path; p=Path('dist/summit-putt.xtapp'); assert p.read_bytes()[:4]==b'XTAP' and p.stat().st_size>256"
      - uses: actions/upload-artifact@v4
        with:
          name: summit-putt-xtapp
          path: dist/summit-putt.xtapp
          if-no-files-found: error
