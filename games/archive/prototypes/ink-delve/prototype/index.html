<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>Ink Delve — pocket dungeon</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#d8d8d8;color:#111;font-family:Inter,Arial,sans-serif}button{font:inherit;color:#111;background:#fff;border:3px solid #111;border-radius:11px;cursor:pointer;touch-action:manipulation;min-height:50px;font-weight:750}button:disabled{color:#777;border-color:#888;cursor:default}button:focus-visible{outline:3px dashed #111;outline-offset:2px}#device{height:min(800px,100dvh);width:min(480px,100vw);margin:0 auto;background:#fff;border:1px solid #111;display:flex;flex-direction:column;overflow:hidden}header{height:76px;flex:none;border-bottom:4px solid #111;padding:12px 17px;display:flex;justify-content:space-between;align-items:center}h1{font-size:30px;line-height:1;margin:0;font-family:Poppins,Inter,Arial,sans-serif;font-weight:800;letter-spacing:-.9px}header .sub{font-size:16px;margin-top:6px;font-weight:650}.head-chip{font-weight:800;font-size:17px;text-align:right;border:2px solid #111;border-radius:8px;padding:9px 8px;min-width:79px}#body{flex:1;display:flex;flex-direction:column;min-height:0;padding:12px 16px 8px}#foot{flex:none;border-top:3px solid #111;padding:10px 16px 13px;display:grid;gap:9px}#foot .row{display:flex;gap:9px}#foot button{flex:1;min-width:0;height:56px;font-size:19px;line-height:1.1}#foot .dir{font-size:27px;font-weight:800}#foot .compact{font-size:16px}.stats{display:flex;justify-content:space-around;border:2px solid #111;border-radius:9px;min-height:52px;align-items:center;gap:5px;padding:5px 4px;margin-bottom:12px;font-size:18px;font-weight:850}.stats span{white-space:nowrap}.board-wrap{flex:1;min-height:0;display:flex;align-items:flex-start;justify-content:center}.board{width:min(404px,100%);aspect-ratio:1/1;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);border:4px solid #111;position:relative;overflow:hidden;background:#fff}.tile{border-right:1px solid #aaa;border-bottom:1px solid #aaa;position:relative;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:23px;line-height:1}.wall{background:#111}.tile.visited:not(.wall):after{content:"";position:absolute;width:5px;height:5px;background:#999;border-radius:50%;bottom:3px;right:3px}.tile .marker{position:relative;z-index:2}.tile .hero{display:flex;align-items:center;justify-content:center;position:absolute;inset:3px;border:3px solid #111;border-radius:50%;background:#fff;z-index:3;font-size:22px;font-weight:900}.tile .exit{border:3px double #111;border-radius:5px;min-width:31px;min-height:31px;text-align:center;line-height:26px;font-size:18px}.tile .item{display:inline-flex;align-items:center;justify-content:center;border:2px solid #111;min-width:26px;height:28px;border-radius:4px;font-size:19px}.tile .enemy{border-radius:50%}.trail{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}.message{font-size:18px;line-height:1.25;min-height:40px;font-weight:650;margin-top:8px;text-align:center;display:flex;align-items:center;justify-content:center}.legend{font-size:15px;line-height:1.3;text-align:center;margin-top:4px;color:#333}.panel{border:3px solid #111;border-radius:12px;padding:20px 18px;margin:15px 0 14px}.panel h2{font-size:28px;margin:0 0 12px;line-height:1.15}.panel p{font-size:21px;line-height:1.4;margin:0 0 14px}.panel p:last-child{margin:0}.panel .small{font-size:18px}.panel .rule{border-top:2px solid #111;padding-top:12px}.big-num{font-size:50px;font-weight:900;line-height:1;margin:12px 0}.center{text-align:center}.spread{display:flex;gap:10px;justify-content:space-between}.spread .score{flex:1;padding:13px 6px;text-align:center;border:2px solid #111;border-radius:7px;font-size:18px;font-weight:750}.score strong{display:block;font-size:30px}.spacer{flex:1}#foot .danger{background:#111;color:#fff}#foot button:active{background:#ededed}.screen{flex:1;min-height:0;display:flex;flex-direction:column}.screen .bottom-note{font-size:18px;line-height:1.35;margin-top:auto}.title-tag{font-size:17px;font-weight:850;letter-spacing:1.5px;margin-top:14px}.card-art{width:100%;height:220px;border:3px solid #111;border-radius:12px;margin:20px 0 15px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.card-art .art-grid{display:grid;grid-template-columns:repeat(7,35px);grid-template-rows:repeat(4,35px)}.art-grid i{width:35px;height:35px;border:1px solid #999;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:900;font-size:21px}.art-grid i.block{background:#111}.art-grid i.p{outline:3px solid #111;outline-offset:-4px;border-radius:50%}.kbd{font-size:17px}@media (max-height:700px){header{height:66px}#body{padding:7px 12px}.stats{margin-bottom:4px}.message{font-size:16px;min-height:28px}#foot{padding:5px 10px}#foot button{height:48px}}@media(max-width:480px){#device{border:0}}
</style></head><body>
<main id="device" aria-label="Ink Delve game, designed for a 480 by 800 display"><header><div><h1>INK DELVE</h1><div class="sub" id="subtitle">A pocket dungeon</div></div><div class="head-chip" id="chapter">SOLO<br>ADVENTURE</div></header><section id="body"></section><nav id="foot"></nav></main>
<script>
'use strict';
// Original game mechanics and six handcrafted floors; no Paper Apps content reused.
const MAPS=[
['#########','#..G...E#','#.#.#.#.#','#...M...#','##.###..#','#..G.K..#','#.#.#.#.#','#S..H...#','#########'],
['#########','#E..#..G#','#...#...#','#.K...M.#','#.#.##..#','#...G...#','#..##.#.#','#S.H...G#','#########'],
['#########','#..G...E#','#.#.##..#','#K..M...#','##..#.#.#','#..G..H.#','#.#..#..#','#S...M..#','#########'],
['#########','#E...#G.#','#.#.M...#','#...##..#','#.#..#K.#','#...H...#','#..#..#.#','#S.G....#','#########'],
['#########','#G.....E#','#.#.##..#','#..M.#K.#','#.#..#..#','#..G...H#','#..#.#..#','#S...M..#','#########'],
['#########','#E..M...#','#.#.###.#','#G..#..K#','##..#...#','#...H.#.#','#.#..#..#','#S..M...#','#########']
];
const NAMES=['The Old Gate','Broken Gallery','Sunken Archive','Echo Hall','Ashen Crossing','The Final Vault'];
const STORE='ink-delve-prototype-v1', BEST='ink-delve-best-v1';
const $=id=>document.getElementById(id);
let s=null,view='title',note='',previousView='game';
const defaultAt=n=>{for(let y=0;y<9;y++)for(let x=0;x<9;x++)if(MAPS[n][y][x]==='S')return{x,y};throw Error('Missing start');};
const pos=(x,y)=>x+','+y;
const stored=()=>{try{return JSON.parse(localStorage.getItem(STORE))}catch{return null}};
function validate(z){return z&&z.version===1&&Number.isInteger(z.floor)&&z.floor>=0&&z.floor<MAPS.length&&Number.isInteger(z.hp)&&z.hp>=0&&z.hp<=12&&Number.isInteger(z.coins)&&z.coins>=0&&Number.isInteger(z.focus)&&z.focus>=0&&z.focus<=5&&Number.isInteger(z.seed)&&Number.isInteger(z.moves)&&z.moves>=0&&Number.isInteger(z.torches)&&z.torches>=0&&z.torches<=20&&z.hero&&Number.isInteger(z.hero.x)&&Number.isInteger(z.hero.y)&&MAPS[z.floor]?.[z.hero.y]?.[z.hero.x]&&MAPS[z.floor][z.hero.y][z.hero.x]!=='#'&&Array.isArray(z.taken)&&z.taken.every(t=>typeof t==='string')&&Array.isArray(z.trail)&&z.trail.every(t=>Array.isArray(t)&&t.length===2&&t.every(Number.isInteger))&&typeof z.key==='boolean'&&(z.roll===null||Number.isInteger(z.roll)&&z.roll>=1&&z.roll<=3)&&typeof z.precise==='boolean'&&(z.encounter===null||z.encounter==='monster')};
function persist(){try{if(s)localStorage.setItem(STORE,JSON.stringify(s));}catch{}}
function clearSave(){try{localStorage.removeItem(STORE)}catch{}}
function start(seed){let v=(seed==null?(Date.now()^0xBADCAFE):seed)|0; if(v===0)v=1; s={version:1,floor:0,hp:12,coins:0,focus:4,seed:v,moves:0,torches:20,hero:defaultAt(0),taken:[],trail:[],key:false,roll:null,precise:false,encounter:null,looted:0,defeated:0};s.trail=[[s.hero.x,s.hero.y]];view='game';note='Find K, then reach E. Roll to move.';persist();render()}
function resume(){const z=stored();if(!validate(z))return false;s=z;view=s.encounter?'encounter':'game';note='Your expedition continues.';render();return true}
function rand(){let x=s.seed|0;x^=x<<13;x^=x>>>17;x^=x<<5;s.seed=x|0;return x>>>0}
function roll(){if(view!=='game'||s.roll!==null)return;s.roll=1+rand()%3;s.precise=false;note='Stride '+s.roll+'. Pick a direction.';persist();render()}
function precise(){if(view!=='game'||s.roll===null||s.focus<1)return;s.precise=!s.precise;note=s.precise?'Precise step selected: costs 1 focus.':'Full stride restored.';persist();render()}
function move(dx,dy){if(view!=='game'||s.roll===null)return false;const amount=s.precise?1:s.roll;let {x,y}=s.hero;const path=[];for(let i=0;i<amount;i++){const xx=x+dx,yy=y+dy;if(MAPS[s.floor][yy]?.[xx]==null||MAPS[s.floor][yy][xx]==='#')break;x=xx;y=yy;path.push([x,y]);}if(!path.length){note='Wall ahead. Choose another direction.';render();return false;}
 if(s.precise)s.focus--;s.roll=null;s.precise=false;s.moves++;s.torches=Math.max(0,s.torches-1);
 if(s.torches===0){s.hp--;if(s.hp<=0){end(false,'Your lamp went dark.');return true;}}
 note='Moved '+path.length+' square'+(path.length!==1?'s':'')+'.';
 for(const [px,py] of path){s.hero={x:px,y:py};s.trail.push([px,py]);const cell=MAPS[s.floor][py][px],token=pos(px,py);
   if(cell==='G'&&!s.taken.includes(token)){s.coins+=2;s.looted++;s.taken.push(token);note='Found 2 coins.';}
   else if(cell==='H'&&!s.taken.includes(token)){s.hp=Math.min(12,s.hp+3);s.taken.push(token);note='Restored up to 3 health.';}
   else if(cell==='K'&&!s.taken.includes(token)){s.key=true;s.taken.push(token);note='Brass key secured. Find E.';}
   else if(cell==='M'&&!s.taken.includes(token)){s.encounter='monster';view='encounter';note='A guard blocks your path.';break;}
   else if(cell==='E'){if(s.key){nextFloor();return true;}else note='Stairs are locked. Find the key.';}
 }
 persist();render();return true;
}
function resolve(kind){if(view!=='encounter'||!s||!s.encounter)return;const token=pos(s.hero.x,s.hero.y),cost=s.floor===5?3:2;
 if(kind==='evade'){if(s.focus<2)return;s.focus-=2;note='Slipped past. Spent 2 focus.';}
 else if(kind==='bribe'){if(s.coins<3)return;s.coins-=3;note='Paid 3 coins to pass.';}
 else if(kind==='fight'){s.hp-=cost;s.coins+=3;s.defeated++;note='Won the fight. -'+cost+' HP, +3 coins.';}
 else return;
 if(!s.taken.includes(token))s.taken.push(token);s.encounter=null;view='game';if(s.hp<=0){end(false,'You fell in the dungeon.');return;}persist();render()}
function nextFloor(){if(s.floor===MAPS.length-1){end(true,'All six dungeon floors cleared.');return;}s.floor++;s.hero=defaultAt(s.floor);s.trail=[[s.hero.x,s.hero.y]];s.key=false;s.taken=[];s.roll=null;s.precise=false;s.encounter=null;s.torches=20;s.focus=Math.min(5,s.focus+2);s.hp=Math.min(12,s.hp+2);note='Floor '+(s.floor+1)+' reached. +2 HP, +2 focus.';persist();render()}
function end(won,reason){const score=(s.floor+(won?1:0))*50+s.coins*3+s.hp*5+s.looted*4-s.moves;let best=0;try{best=Number(localStorage.getItem(BEST)||0)||0;if(score>best)localStorage.setItem(BEST,String(score));}catch{} s.score=score;s.won=won;clearSave();view='end';note=reason;render();}
function btn(label,fn,disabled=false,cls=''){const b=document.createElement('button');b.textContent=label;b.disabled=disabled;b.className=cls;b.addEventListener('click',fn);return b;}
function foot(...rows){const p=$('foot');p.replaceChildren();rows.forEach(items=>{const row=document.createElement('div');row.className='row';for(const arg of items)row.appendChild(btn(...arg));p.appendChild(row)})}
function setBody(html){$('body').innerHTML=html}
function setHead(sub,chip){$('subtitle').textContent=sub;$('chapter').innerHTML=chip}
function render(){if(view==='title')return title();if(view==='game')return game();if(view==='encounter')return encounter();if(view==='help')return help();if(view==='end')return ending();}
function title(){setHead('A pocket dungeon','6 FLOORS');const has=validate(stored());setBody(`<div class="screen"><div class="title-tag">PENCIL-AND-PAPER INSPIRED</div><div class="card-art" aria-hidden="true"><div class="art-grid">${Array.from({length:28},(_,i)=>{let c=(i===22?'P':i===6?'E':i===13?'K':i===17?'M':i%11===0?'#':'');return `<i class="${c==='#'?'block':''} ${c==='P'?'p':''}">${c==='#'?'':c}</i>`}).join('')}</div></div><div class="panel"><h2>One path. Six floors.</h2><p>Roll a stride, choose a direction, and trace a route through the dungeon. Find each key and reach the stairs.</p><p class="small">Treasure helps. Monsters force a choice. Every move uses lamp light.</p></div><div class="spacer"></div></div>`);foot([['HOW TO PLAY',()=>{previousView='title';view='help';render()}],['CONTINUE',()=>resume(),!has]],[['NEW EXPEDITION',()=>{if(has&&!confirm('Replace the current expedition?'))return;start()},false,'danger']])}
function game(){setHead(NAMES[s.floor],`FLOOR<br>${s.floor+1} / 6`);const cells=MAPS[s.floor].flatMap((row,y)=>row.split('').map((c,x)=>{const taken=s.taken.includes(pos(x,y)),isHero=s.hero.x===x&&s.hero.y===y;let sym=c==='E'?'<span class="exit">E</span>':c==='K'&&!taken?'<span class="item">K</span>':c==='M'&&!taken?'<span class="item enemy">!</span>':c==='G'&&!taken?'<span class="item">$</span>':c==='H'&&!taken?'<span class="item">+</span>':'';return `<div class="tile ${c==='#'?'wall':''} ${s.trail.some(t=>t[0]===x&&t[1]===y)?'visited':''}" role="gridcell" aria-label="${c==='#'?'Wall':isHero?'You':c==='E'?'Exit':sym?'Item':'Passage'}">${sym?`<span class="marker">${sym}</span>`:''}${isHero?'<span class="hero">P</span>':''}</div>`;})).join('');
 const trail=s.trail.map(([x,y])=>`${((x+.5)/9*100).toFixed(2)},${((y+.5)/9*100).toFixed(2)}`).join(' ');setBody(`<div class="stats"><span>HP ${s.hp}/12</span><span>$ ${s.coins}</span><span>FOCUS ${s.focus}</span><span>${s.key?'KEY YES':'KEY NO'}</span></div><div class="board-wrap"><div class="board" role="grid" aria-label="Dungeon floor ${s.floor+1}">${cells}<svg class="trail" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polyline fill="none" stroke="#555" stroke-width=".5" vector-effect="non-scaling-stroke" points="${trail}"></polyline></svg></div></div><div class="message" role="status">${note}</div><div class="legend">P you · K key · E exit · ! enemy · $ coins · + healing<br>LIGHT ${s.torches} moves left${s.torches===0?' · -1 HP each move':''} ${s.roll?' · ROLL '+s.roll:''}</div>`);
 const ready=s.roll!==null;foot([['↑',()=>move(0,-1),!ready,'dir'],['←',()=>move(-1,0),!ready,'dir'],['↓',()=>move(0,1),!ready,'dir'],['→',()=>move(1,0),!ready,'dir']],[[(ready?'STRIDE '+s.roll:'ROLL STRIDE'),()=>roll(),ready],[(s.precise?'STEP ON':'STEP 1 (-1)'),()=>precise(),!ready||s.focus===0,'compact'],['RULES',()=>{previousView='game';view='help';render()},false,'compact']]);}
function encounter(){setHead('A choice in the dark',`FLOOR<br>${s.floor+1} / 6`);const cost=s.floor===5?3:2;setBody(`<div class="screen"><div class="title-tag">ENCOUNTER</div><div class="panel"><h2>Watchful Sentinel</h2><p>A stone sentinel blocks the corridor. Its weapons are raised. How do you get past?</p><div class="big-num center">!</div><div class="spread"><div class="score"><strong>${s.hp}</strong>HP</div><div class="score"><strong>${s.focus}</strong>Focus</div><div class="score"><strong>${s.coins}</strong>Coins</div></div></div><p class="bottom-note"><strong>Fight</strong> costs ${cost} HP but earns 3 coins.<br><strong>Evade</strong> costs 2 focus, no loot.<br><strong>Bribe</strong> costs 3 coins, no damage.</p></div>`);foot([['FIGHT',()=>resolve('fight')],['EVADE',()=>resolve('evade'),s.focus<2]],[['BRIBE -3 COINS',()=>resolve('bribe'),s.coins<3]])}
function help(){setHead('How to play','RULES');setBody(`<div class="screen"><div class="panel"><h2>Read the Map</h2><p class="small">Each floor has one <b>K</b> key and an <b>E</b> exit. Collect the key before reaching the stairs. Your route is drawn on the grid.</p><p class="small rule"><b>ROLL</b> gives a stride of 1–3 squares. Choose one direction using the large arrows. Walls stop your movement. A blocked choice doesn't consume the roll.</p><p class="small rule"><b>STEP 1</b> uses 1 focus to travel exactly one square instead, useful for avoiding danger or landing precisely.</p><p class="small rule"><b>!</b> makes you fight, evade or bribe. <b>$</b> grants 2 coins. <b>+</b> heals 3 HP. Movement uses lamp light; once it's out, each move costs 1 HP.</p></div><p class="bottom-note">No swiping, animation, timers or network. Your expedition saves automatically after every choice.</p></div>`);foot([['BACK',()=>{view=previousView==='title'?'title':'game';render()}]])}
function ending(){setHead(s.won?'Expedition complete':'Expedition ended',s.won?'VICTORY':'DEFEAT');let best=0;try{best=Number(localStorage.getItem(BEST)||0)||0}catch{}setBody(`<div class="screen"><div class="title-tag">${s.won?'THE FINAL STAIR':'THE TORCH GOES OUT'}</div><div class="panel"><h2>${s.won?'You made it out.':'Your expedition ends.'}</h2><p>${note}</p><div class="big-num center">${s.score}</div><p class="center">EXPEDITION SCORE</p><div class="spread"><div class="score"><strong>${s.floor+(s.won?1:0)}</strong>Floors</div><div class="score"><strong>${s.moves}</strong>Moves</div><div class="score"><strong>${s.looted}</strong>Finds</div></div><p class="small" style="margin-top:22px">Best score: ${best}. Replay to find safer routes and bring home more treasure.</p></div></div>`);foot([['MAIN MENU',()=>{view='title';render()}],['NEW RUN',()=>start()]])}
window.addEventListener('keydown',e=>{if(view==='game'){if(e.key==='r'||e.key==='R'){roll();return}if(e.key==='s'||e.key==='S'){precise();return}const d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(d){e.preventDefault();move(...d)}}});
if(!MAPS.every(m=>m.length===9&&m.every(r=>r.length===9)))throw Error('Invalid map');
window.__inkDelveTest={start,roll,move,precise,resolve,nextFloor,stored,validate,state:()=>s,view:()=>view,maps:MAPS};
render();
</script></body></html>
