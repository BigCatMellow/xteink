<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/><title>Margin Codex — e-ink puzzle-book prototype</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#ddd;font-family:Inter,'Segoe UI',Arial,sans-serif;color:#111}button{font:inherit;color:inherit;background:white;border:3px solid #111;border-radius:10px;min-height:50px;touch-action:manipulation;cursor:pointer}button:focus-visible{outline:4px double #111;outline-offset:2px}button:disabled{opacity:.45}#device{width:min(480px,100vw);height:min(800px,100dvh);margin:0 auto;background:#fff;display:flex;flex-direction:column;overflow:hidden;border:1px solid #111}header{height:96px;flex:none;padding:16px 18px 10px;border-bottom:4px solid #111;display:flex;align-items:flex-start;justify-content:space-between;gap:14px}h1{font-size:28px;letter-spacing:-.5px;line-height:1.1;margin:0}#meta{font-size:17px;margin-top:9px}#page{flex:1;min-height:0;overflow:hidden;padding:20px 24px;display:flex;flex-direction:column}#page h2{font-size:27px;line-height:1.1;margin:0 0 16px}#page p{font-size:22px;line-height:1.4;margin:0 0 18px}.clue{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}.paper{width:100%;border:3px solid #111;border-radius:12px;padding:21px 12px;text-align:center}.paper .line{font-size:25px;font-weight:600;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.paper .line.small{font-size:21px}.footnote{font-size:17px!important;text-align:center;margin:12px 0 0!important}.actions{flex:none;display:flex;gap:10px;padding:12px 16px 18px;border-top:3px solid #111}.actions button{flex:1;min-width:0;font-size:18px;font-weight:650;padding:4px}.symbol{letter-spacing:3px;font-family:Consolas,'Courier New',monospace}.case{border:2px solid #111;border-radius:8px;padding:16px;margin:0 0 10px;width:100%;background:#fff;text-align:left;min-height:74px;font-size:20px}.case strong{display:block;font-size:22px}.case span{font-size:16px}.hint{font-size:23px!important;margin-top:10px!important;line-height:1.5!important}.muted{font-size:18px!important}.answer{border:3px solid #111;border-radius:12px;min-height:67px;display:flex;align-items:center;justify-content:center;letter-spacing:3px;font-size:27px;font-weight:700;overflow:hidden;word-break:break-word;padding:10px;margin-bottom:17px}.keyboard{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.keyboard button{border-radius:7px;font-size:20px;min-height:55px;font-weight:650}.keyboard button.wide{font-size:12px;letter-spacing:-.2px}.status{font-size:19px!important;text-align:center;margin-top:16px!important}.pages-title{margin-bottom:8px}.scroll{overflow:auto;flex:1;min-height:0}.progress{padding:8px 10px;border:2px solid #111;border-radius:8px;min-width:76px;text-align:center;font-size:17px;font-weight:650}#page .help{font-size:20px;line-height:1.4}.solved{border:3px solid #111;border-radius:12px;padding:15px;text-align:center;font-weight:bold;font-size:23px;margin-top:6px}@media (max-width:480px){#device{border:0}}@media (max-height:680px){#page{padding:12px 18px}#page p{font-size:18px}.paper{padding:10px}.paper .line{font-size:21px;line-height:1.4}.keyboard button{min-height:45px}}
</style></head><body><main id="device" aria-label="480 by 800 e-ink game screen"><header><div><h1>MARGIN CODEX</h1><div id="meta">A pocket puzzle book</div></div><div class="progress" id="progress">0 / 16</div></header><section id="page" aria-live="polite"></section><nav class="actions" id="actions"></nav></main>
<script>
'use strict';
// All entries are original puzzle content. The source book's puzzles and art are not used.
const puzzles=[
 {title:'The Dawn Register',type:'NUMBER',difficulty:'TRAINING',prompt:'A gardener recorded the sunrise with numbers. What did they mean?',lines:['19   21   14','18    9   19    5'],note:'Every letter has a place.',answer:'SUNRISE',hints:['There are 26 possible values.','Try A = 1, B = 2, and so on.','19 = S. Continue translating each number.'],explain:'Replace every number with its position in the alphabet: 19 21 14 18 9 19 5 becomes SUNRISE.'},
 {title:'Five Stops',type:'INDEX',difficulty:'TRAINING',prompt:'A traveler left five names and five step counts. Where was the journey headed?',lines:['1   CANDLE','2   BOAT','3   HEARD','4   MOSS','5   SHOUT'],note:'The number is your step.',answer:'COAST',hints:['Each row yields exactly one letter.','Count into each word from the left.','C from CANDLE, O from BOAT, A from HEARD ...'],explain:'Take the numbered letter in each word, in row order: C O A S T.'},
 {title:'A Change in the Wind',type:'ACROSTIC',difficulty:'EASY',prompt:'A forecast with no weather symbols was pinned to the door. What does it predict?',lines:['Waves carry the mist.','Islands fade in fog.','Night gives way to blue.','Dunes remember storms.'],note:'The forecast starts somewhere.',answer:'WIND',hints:['It is a four-letter answer.','Focus on the beginning of each sentence.','Read the first letter of each line downward.'],explain:'The first letters of the four forecast lines spell WIND.'},
 {title:'The Fast Clock',type:'SHIFT',difficulty:'MEDIUM',prompt:'An old wall clock runs three hours ahead. A sailor wrote his destination to match it.',lines:['K  D  U  E  R  U'],note:'Turn the hands back.',answer:'HARBOR',hints:['The clock is a clue to the letters.','Each written letter has moved three places forward.','Move K back to H, D back to A, and continue.'],explain:'Move every letter backward by three alphabet places (a Caesar shift): KDUERU becomes HARBOR.'},
 {title:'The Tide Table',type:'ORDER',difficulty:'MEDIUM',prompt:'A station clerk copied five entries in a hurry. Read the final signal.',lines:['18:00     S','06:00     T','12:00     D','09:00     I','15:00     E'],note:'The tide never runs backward.',answer:'TIDES',hints:['The five letters are already here.','Find the correct order of the observations.','Sort entries by time from earliest to latest.'],explain:'Chronological order is 06:00 T, 09:00 I, 12:00 D, 15:00 E, 18:00 S: TIDES.'},
 {title:'The Silent Beacon',type:'SIGNAL',difficulty:'HARD',prompt:'A beacon flashes only short and long signals, separated into five groups. What direction does it report?',lines:['-.    ---    .-.','-     ....'],note:'Short. Long. Silence.',answer:'NORTH',hints:['These marks encode letters, not numbers.','Short and long signals form Morse code.','-. is N and --- is O; decode the remaining three.'],explain:'The five Morse-code groups are N (-.), O (---), R (.-.), T (-), H (....): NORTH.'}
,
 {"title": "The Compass Garden", "type": "PATH", "difficulty": "MEDIUM", "prompt": "A botanist traced one walk through a letter garden. What flower did the walk describe?", "lines": ["M    A    P    S", "O    R    I    D", "B    C    H    E", "L    T    E    N", "START: O", "E   S   E   N   E"], "note": "Each direction moves one square.", "answer": "ORCHID", "hints": ["The top four lines make a four-by-four garden.", "Begin at O, then move one square East, South, East, North, East.", "Read the letter at every stop, including the starting O."], "explain": "Starting at O, the moves E, S, E, N, E land on R, C, H, I, D. Read the trail: ORCHID."},
 {"title": "The Borrowed Letters", "type": "MISSING", "difficulty": "MEDIUM", "prompt": "Six words were shortened by exactly one letter each. What vanished?", "lines": ["BRIDE  >  BIDE", "PAINT  >  PANT", "DRAIN  >  RAIN", "DREAM  >  REAM", "FLAME  >  FAME", "PLANE  >  PLAN"], "note": "Collect what each pair lost.", "answer": "RIDDLE", "hints": ["Every word on the right is missing one letter from the left.", "Record the missing letter from each pair in row order.", "BRIDE loses R, PAINT loses I, and DRAIN loses D."], "explain": "The removed letters are R, I, D, D, L and E: RIDDLE."},
 {"title": "The Four Plaques", "type": "TRUTH", "difficulty": "HARD", "prompt": "Four doors have signs. Exactly THREE signs are true. Which door is the exit?", "lines": ["NORTH: Not north.", "EAST: Not west.", "SOUTH: East.", "WEST: North."], "note": "A sign can tell the truth about another door.", "answer": "EAST", "hints": ["Test each door as the possible exit.", "For an East exit, the North, East and South signs are true.", "North gives two true signs, South two, and West one."], "explain": "If the exit is EAST, three signs are true and the West sign is false. No other door makes exactly three true statements."},
 {"title": "The Ink Calendar", "type": "PRIMES", "difficulty": "HARD", "prompt": "An archivist marked one letter beside each date. Only the indivisible dates matter. What is the message?", "lines": ["02 B     03 E", "04 T     05 A", "06 R     07 C", "08 I     09 P", "10 L     11 O", "12 W     13 N"], "note": "One is not on the calendar.", "answer": "BEACON", "hints": ["An indivisible date has exactly two positive divisors.", "Select the prime dates from 2 through 13.", "Read 02, 03, 05, 07, 11, 13 in order."], "explain": "The prime dates 2, 3, 5, 7, 11 and 13 spell B, E, A, C, O, N: BEACON."},
 {"title": "The Scale Room", "type": "ORDER", "difficulty": "MEDIUM", "prompt": "Six brass letters were weighed against each other. Read them from heaviest to lightest.", "lines": ["R  >  I", "B  >  R", "I  >  D", "D  >  G", "G  >  E"], "note": "The greater sign means heavier.", "answer": "BRIDGE", "hints": ["These are not five separate answers: they belong to one ordering.", "Find the letter with nothing heavier than it.", "B is heavier than R, which is heavier than I, and so on."], "explain": "The complete descending weight chain is B > R > I > D > G > E, spelling BRIDGE."},
 {"title": "The Center Fold", "type": "CENTER", "difficulty": "MEDIUM", "prompt": "A courier insisted that the outside of each word was worthless. Where should the parcel go?", "lines": ["BAG", "RIVER", "SHELF", "PANEL", "DRUMS", "FLEET"], "note": "Every word has one center.", "answer": "AVENUE", "hints": ["The words all have an odd number of letters.", "Take the exact middle letter of each word.", "The first three centers are A, V and E."], "explain": "The middle letters are A from BAG, V from RIVER, E from SHELF, N from PANEL, U from DRUMS and E from FLEET: AVENUE."},
 {"title": "The Secret Margins", "type": "EDGES", "difficulty": "MEDIUM", "prompt": "A bookbinder saved only the beginning and end of each torn page. Where does the path lead?", "lines": ["GALA", "ROAD", "EVEN"], "note": "Keep the first and the last, in that order.", "answer": "GARDEN", "hints": ["Each line contributes two letters.", "The outside letters of GALA are G and A.", "ROAD contributes R and D; EVEN contributes E and N."], "explain": "The first and last letters of GALA, ROAD and EVEN give GA + RD + EN: GARDEN."},
 {"title": "The Shared Alphabet", "type": "OVERLAP", "difficulty": "HARD", "prompt": "Five pairs of words crossed paths. Each pair shares exactly one letter. What remains?", "lines": ["SILT  /  MOSS", "HALL  /  THIN", "BOAT  /  CORN", "RUST  /  BRIM", "COVE  /  FIRE"], "note": "Find one letter in both halves of each pair.", "answer": "SHORE", "hints": ["Ignore letter position: the letter need only occur in both words.", "SILT and MOSS share S; HALL and THIN share H.", "Find one shared letter from each row and read downward."], "explain": "The unique common letters in the five rows are S, H, O, R and E: SHORE."},
 {"title": "The Second Knock", "type": "PAIRS", "difficulty": "HARD", "prompt": "A visitor knocked twice at each of six doors. Only the second knock was answered. What could they see?", "lines": ["COLD     WATER", "LAST     ISLAND", "MOSS     NORTH", "QUIET    DOOR", "SILVER   OAK", "LATE     WIND"], "note": "First is the knock. Second is the answer.", "answer": "WINDOW", "hints": ["There are two words on each row. Keep only the second.", "Read the first letters of the answers, not the knocks.", "WATER, ISLAND, NORTH, DOOR, OAK, WIND supply the letters."], "explain": "The initial letters of the second words spell W I N D O W: WINDOW."},
 {"title": "The Index of Places", "type": "COORDINATES", "difficulty": "HARD", "prompt": "An old directory uses a five-by-five letter index. Read the coordinates as row, then column.", "lines": ["A B C D E", "F G H I K", "L M N O P", "Q R S T U", "V W X Y Z", "11  44  31  11  43"], "note": "I and J share a shelf.", "answer": "ATLAS", "hints": ["The letters form five rows and five columns, numbered from 1.", "Coordinate 11 means row 1, column 1: A.", "44 is T, 31 is L, 11 is A and 43 is S."], "explain": "Look up each row-column pair: 11 A, 44 T, 31 L, 11 A, 43 S: ATLAS."}
];
const KEY='margin-codex-v1';let state={view:'list',index:0,listPage:0,draft:'',hint:0,notice:''};let saved={solved:[],drafts:{},hints:{}};
try{const read=JSON.parse(localStorage.getItem(KEY));if(read && Array.isArray(read.solved))saved={solved:[...new Set(read.solved.filter(n=>Number.isInteger(n)&&n>=0&&n<puzzles.length))],drafts:read.drafts||{},hints:read.hints||{}};}catch{}
const el=id=>document.getElementById(id);const escapeHTML=t=>String(t).replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(saved));}catch{}};
function buttons(...items){el('actions').replaceChildren();for(const [label,action] of items){let b=document.createElement('button');b.textContent=label;b.addEventListener('click',action);el('actions').appendChild(b)}}
function open(i){state={view:'puzzle',index:i,listPage:Math.floor(i/5),draft:saved.drafts[i]||'',hint:saved.hints[i]||0,notice:''};render()}
function render(){el('progress').textContent=`${saved.solved.length} / ${puzzles.length}`;if(state.view==='list')return showList();const p=puzzles[state.index];el('meta').textContent=`PAGE ${state.index+1} / ${puzzles.length} · ${p.difficulty}`;if(state.view==='puzzle')return showPuzzle(p);if(state.view==='answer')return showAnswer(p);if(state.view==='hints')return showHints(p);if(state.view==='solved')return showSolved(p);}
function showList(){el('meta').textContent='A pocket puzzle book';const perPage=5;const pages=Math.ceil(puzzles.length/perPage);state.listPage=Math.max(0,Math.min(state.listPage||0,pages-1));const start=state.listPage*perPage;el('page').innerHTML=`<h2 class="pages-title">The Book</h2><p class="muted">16 original word-and-logic puzzles. Choose a page; all progress is saved. Pages ${start+1}-${Math.min(start+perPage,puzzles.length)}.</p><div class="scroll" id="listing"></div>`;const box=el('listing');puzzles.slice(start,start+perPage).forEach((p,j)=>{const i=start+j;const b=document.createElement('button');b.className='case';b.innerHTML=`<strong>${String(i+1).padStart(2,'0')}. ${escapeHTML(p.title)}</strong><span>${p.difficulty} · ${saved.solved.includes(i)?'SOLVED':'UNSOLVED'}</span>`;b.addEventListener('click',()=>open(i));box.appendChild(b)});buttons(['HELP',()=>{state.view='help';showHelp()}],['PREV',()=>{if(state.listPage>0){state.listPage--;render()}}],['NEXT',()=>{if(state.listPage<pages-1){state.listPage++;render()}}]);const bs=el('actions').querySelectorAll('button');bs[1].disabled=state.listPage===0;bs[2].disabled=state.listPage===pages-1;}
function showHelp(){el('meta').textContent='INSTRUCTIONS';el('page').innerHTML='<h2>How to Play</h2><p class="help">Each page contains a self-contained puzzle. Discover a word or short phrase from the clues and marks.</p><p class="help">Tap ANSWER to type your solution on a separate screen. HINT reveals one of three increasingly direct clues.</p><p class="help">Use the numbered book list to revisit any puzzle. Progress and unfinished answers are saved in this browser.</p><p class="help">Designed for a 480 × 800 monochrome e-ink screen, with large touch controls and no animation.</p>';buttons(['BACK TO BOOK',()=>{state.view='list';render()}])}
function showPuzzle(p){const rows=p.lines.map(t=>`<div class="line ${t.length>22?'small':''} ${p.type==='SIGNAL'?'symbol':''}">${escapeHTML(t)}</div>`).join('');el('page').innerHTML=`<h2>${escapeHTML(p.title)}</h2><p>${escapeHTML(p.prompt)}</p><div class="clue"><div class="paper">${rows}</div></div><p class="footnote">${escapeHTML(p.note)}</p>${saved.solved.includes(state.index)?'<div class="solved">SOLVED</div>':''}`;buttons(['BOOK',()=>{state.view='list';render()}],['HINT',()=>{state.view='hints';render()}],['ANSWER',()=>{state.view=saved.solved.includes(state.index)?'solved':'answer';render()}])}
function showHints(p){let used=saved.hints[state.index]||0;let section=used===0?'No hints revealed. Choose REVEAL to uncover the first.':p.hints.slice(0,used).map((s,i)=>`<p class="hint"><strong>HINT ${i+1}</strong><br>${escapeHTML(s)}</p>`).join('');el('page').innerHTML=`<h2>${escapeHTML(p.title)}</h2><p class="muted">Reveal hints one at a time.</p><div class="scroll">${section}</div>`;buttons(['BACK',()=>{state.view='puzzle';render()}],['REVEAL',()=>{if(used<3){saved.hints[state.index]=used+1;persist();render();}}]);el('actions').lastElementChild.disabled=used>=3}
function showAnswer(p){const a=state.draft||'';el('page').innerHTML=`<h2>${escapeHTML(p.title)}</h2><p class="muted">Enter the word or phrase you found.</p><div class="answer" aria-label="Your answer">${escapeHTML(a)||'_'}</div><div class="keyboard" id="keyboard"></div><p class="status" id="status">${escapeHTML(state.notice)}</p>`;const keys='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').concat(['SPACE','DELETE']);for(const k of keys){const b=document.createElement('button');b.className=k.length>1?'wide':'';b.textContent=k==='DELETE'?'DEL':k;b.setAttribute('aria-label',k);b.addEventListener('click',()=>{if(k==='DELETE')state.draft=state.draft.slice(0,-1);else if(k==='SPACE')state.draft=state.draft.length<18?state.draft+' ':state.draft;else if(state.draft.length<18)state.draft+=k;saved.drafts[state.index]=state.draft;persist();state.notice='';showAnswer(p)});el('keyboard').appendChild(b)}buttons(['PUZZLE',()=>{state.view='puzzle';render()}],['CHECK',()=>{if(state.draft.replace(/[^A-Z]/g,'')===p.answer){if(!saved.solved.includes(state.index))saved.solved.push(state.index);persist();state.view='solved';render()}else{state.notice=state.draft?'Not quite. Try another reading.':'Enter an answer first.';showAnswer(p)}}])}
function showSolved(p){el('page').innerHTML=`<h2>Page Solved</h2><div class="solved">${escapeHTML(p.answer)}</div><p class="hint">${escapeHTML(p.explain)}</p><p class="muted">You can revisit the page without losing your progress.</p>`;buttons(['BACK TO BOOK',()=>{state.view='list';render()}],['NEXT PAGE',()=>open((state.index+1)%puzzles.length)])}
window.addEventListener('keydown',e=>{if(state.view==='answer'){if(/^[a-z]$/i.test(e.key)){state.draft=(state.draft+e.key.toUpperCase()).slice(0,18);saved.drafts[state.index]=state.draft;persist();showAnswer(puzzles[state.index])}else if(e.key==='Backspace'){state.draft=state.draft.slice(0,-1);saved.drafts[state.index]=state.draft;persist();showAnswer(puzzles[state.index])}else if(e.key==='Enter'){document.querySelector('#actions button:last-child')?.click()}}else if(state.view==='puzzle' && (e.key==='ArrowDown'||e.key==='ArrowUp')){open((state.index+puzzles.length+(e.key==='ArrowDown'?1:-1))%puzzles.length)}else if(state.view==='list' && (e.key==='ArrowDown'||e.key==='ArrowUp')){const total=Math.ceil(puzzles.length/5);state.listPage=Math.max(0,Math.min(total-1,state.listPage+(e.key==='ArrowDown'?1:-1)));render()}});
render();
</script></body></html>
